# Runner pod: two containers from the same stock runner image. minter holds
# the GitHub App's key and mints one just-in-time runner config at a time
# (mint.sh). runner takes each config, runs one job with it, and loops
# (entrypoint.sh). See the README for the design and the security notes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-runner
  labels:
    app: github-runner
spec:
  # One pod is one runner, and one runner takes one job at a time.
  replicas: 1
  selector:
    matchLabels:
      app: github-runner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: github-runner
    spec:
      # The runner has no reason to reach the Kubernetes API, so don't mount a
      # token for it (it uses the namespace default ServiceAccount).
      automountServiceAccountToken: false
      # UID 1001 is the runner image's "runner" user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        # Unmodified upstream runner, pinned.
        - name: runner
          image: ghcr.io/actions/actions-runner:2.338.2
          command: ["/bin/bash", "/entrypoint/entrypoint.sh"]
          # No App credentials here: jobs run in this container.
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            - name: work
              mountPath: /home/runner/_work
            - name: handoff
              mountPath: /handoff
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # ephemeral-storage is the pod's disk. A vSphere Pod gets about
          # 250 MB unless it asks for more, which one set of Terraform
          # providers already fills. Keep it equal to the work volume's
          # sizeLimit below: the pod needs both to get the space.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 4Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 4Gi
        # Mints the runner's configs. The same image, for its curl, jq and
        # openssl. No job runs in this container, and the pods do not share
        # a process namespace, so the job cannot read its environment.
        - name: minter
          image: ghcr.io/actions/actions-runner:2.338.2
          command: ["/bin/bash", "/entrypoint/mint.sh"]
          # GITHUB_URL, and optionally RUNNER_LABELS and RUNNER_GROUP_ID.
          envFrom:
            - configMapRef:
                name: github-runner
          # From the environment and not a mounted file, so the key is in no
          # volume the runner container could share.
          env:
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: app-id
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: github-app
                  key: private-key.pem
            - name: RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: entrypoint
              mountPath: /entrypoint
              readOnly: true
            - name: handoff
              mountPath: /handoff
            - name: state
              mountPath: /state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
              ephemeral-storage: 64Mi
      volumes:
        - name: entrypoint
          configMap:
            name: github-runner-entrypoint
        # The job's files: the checkout, tools, caches. It's the pod's own
        # disk, created and deleted with the pod, so there's no PVC to clean
        # up afterwards.
        - name: work
          emptyDir:
            sizeLimit: 4Gi
        # One config at a time, from minter to runner.
        - name: handoff
          emptyDir:
            sizeLimit: 1Mi
        # Which runner minter minted last. Only minter mounts it.
        - name: state
          emptyDir:
            sizeLimit: 1Mi
